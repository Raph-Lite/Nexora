apiVersion: apps/v1
kind: Deployment

metadata:
  name: nexxa-dev-app
  namespace: default
  labels:
    app: nexxa-dev

spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexxa-dev
  template:
    metadata:
      labels:
        app: nexxa-dev
    spec:
  containers:
  - name: web-server
    # Update this line to match your AWS ECR Registry URI
    image: ://amazonaws.com
    imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service

metadata:
  name: nexxa-dev-service
  namespace: default

spec:
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30303
  selector:
    app: nexxa-dev
